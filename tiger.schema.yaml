schema:
  author:
    - {}
  description: |
    虎码官方单字
    敲 ` 鍵進入拼音反查
  name: "虎码官方单字"
  schema_id: tiger
  version: 0.9

switches: # 0 默认关，1 默认开
  - name: ascii_mode
    reset: 0
    states: [中文, 西文] #中英文状态
  - name: extended_char #自定义字集
    reset: 1
    states: [全集, 常用]
  - name: pinyin #拼音滤镜
    reset: 0
    states: [拼, pīn]
  - name: emoji_cn #emoji滤镜
    reset: 1
    states: [🈚, 🈶]
  - name: chaifen
    reset: 1
    states: [拆隐, 拆显]
  # - options: [ gb2312, gbk, utf8 ]
  #   states: [ gb2312, GBK, UTF-8 ]
  #   reset: 0
  - name: simplification #简转繁滤镜
    reset: 0
    states: [简中, 繁中]
  - options: [_keyboard_default, _keyboard_defaultbk, _keyboard_defaultwk]
    reset: 0
    states: [有刻, 半刻, 无刻]
  - name: charset_comment_filter #字符集提示
    reset: 0
    states: [U区关, U区开]
  - name: udpf_switch
    reset: 0
    states: [U编关, U编开]
  - name: ascii_punct
    reset: 0
    states: [。，, ．，]
  # - name: dz_ci  #过滤词组
  #   reset: 0
  #   states: [ 词组, 单字 ]
  - options: [_keyboard_default, _keyboard_defaultzj]
    reset: 0
    states: [助记关, 助记开]
  # - name: fanjian  #繁转简滤镜
  #   reset: 0
  #   states: [ 反繁, 反简 ]
  - name: full_shape
    reset: 0
    states: [半角, 全角]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
  filters:
    # - charset_filter@gbk+emoji
    # - charset_filter@utf8
    - uniquifier

speller:
  auto_clear: max_length
  auto_select: true
  max_code_length: 4


translator:
  dictionary: tiger
  enable_charset_filter: false
  enable_encoder: true
  enable_sentence: false
  encode_commit_history: true
  max_phrase_length: 4
  enable_user_dict: false
  enable_completion: false

reverse_lookup:
  dictionary: moran.chars
  prefix: "`"
  suffix: "'"
  tips: "〔魔然〕"

punctuator:
  import_preset: symbols

key_binder:
#  import_preset: default
  bindings:
    - {accept: semicolon, send: 2, when: has_menu}

recognizer:
  import_preset: default
  patterns:
    punct: '^/([0-9]0?|[A-Za-z]+)$'
    reverse_lookup: "^`[a-z]*'?$"


#menu:
#  page_size: 3
