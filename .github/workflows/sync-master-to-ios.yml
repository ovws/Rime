name: One-time sync master to iOS and release

on:
  push:
    branches: [ios]
    paths:
      - ".github/workflows/sync-master-to-ios.yml"

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Pull master configuration into iOS runtime pack
        shell: bash
        run: |
          git fetch origin master --depth=1
          while IFS= read -r path; do
            if git cat-file -e "origin/master:$path" 2>/dev/null; then
              git checkout origin/master -- "$path"
            fi
          done < <(git ls-tree -r --name-only HEAD)

          # New runtime files used by the Simplified Moran configuration.
          git checkout origin/master -- \
            moran.custom.yaml \
            opencc/moran_TSCharacters.ocd2 \
            opencc/moran_chaifen.ocd2 \
            opencc/moran_dzing_variants.ocd2 \
            opencc/moran_emoji.ocd2 \
            opencc/moran_pinyinhint.ocd2

          # Keep only iOS-specific files in this branch; remove this one-time workflow.
          git rm --ignore-unmatch .github/workflows/sync-master-to-ios.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ios): sync current master runtime configuration"
          git push origin HEAD:ios

      - name: Create downloadable iOS release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="ios-2026.09.08-master-sync"
          asset="Rime-iOS-Hamster-Hamster3-2026.09.08-master-sync.zip"
          git tag "$tag"
          git push origin "$tag"
          git archive --format=zip --output="$asset" HEAD
          gh release create "$tag" "$asset" \
            --title "Rime iOS · 仓输入法 / 元书输入法 · master 同步" \
            --notes "基于 master 当前配置同步。保留仓输入法与元书输入法 iOS 专用配置；默认简体，并包含表情候选、拆分显示与拼音提示所需文件。"
