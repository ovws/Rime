name: One-time iOS release

on:
  push:
    paths:
      - ".github/workflows/release-ios.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package and publish iOS bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-ios.yml
          git commit -m "chore(ios): remove one-time release workflow"
          git push
          asset="Rime-iOS-Hamster-Hamster3-2026.09.08.zip"
          git archive --format=zip --output="$asset" HEAD
          gh release create "ios-2026.09.08" "$asset" \
            --target HEAD \
            --title "Rime iOS · 仓输入法 / 元书输入法 · 2026.09.08" \
            --notes "基于 ios 分支构建。包含魔然、虎码、拼音++、仓输入法键盘配置及元书同步规则；拼音提示和拆分提示默认开启。"
