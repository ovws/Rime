name: One-time Moran core sync

on:
  push:
    paths:
      - ".github/workflows/moran-core-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Sync upstream runtime files
        shell: bash
        run: |
          git remote add moran-upstream https://github.com/rimeinn/rime-moran.git
          git fetch moran-upstream main --depth=1
          git checkout moran-upstream/main -- default.yaml symbols.yaml tiger.dict.yaml tiger.schema.yaml zrlf.schema.yaml ':(glob)moran*' ':(glob)lua/moran*.lua' ':(glob)opencc/moran*'
          git checkout HEAD -- moran_custom_phrases.txt
          git rm --ignore-unmatch .github/workflows/moran-core-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(moran): sync core files from upstream"
          git push

