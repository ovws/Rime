name: One-time iOS runtime fix release

on:
  push:
    branches: [ios]
    paths:
      - ".github/workflows/release-ios-runtime-fix.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Create runtime-fix archive and release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git rm --ignore-unmatch .github/workflows/release-ios-runtime-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(ios): remove one-time runtime fix release workflow"
          git push origin HEAD:ios

          tag="ios-2026.09.08-runtime-fix"
          asset="Rime-iOS-Hamster-Hamster3-2026.09.08-runtime-fix.zip"
          git tag "$tag"
          git push origin "$tag"
          git archive --format=zip --output="$asset" HEAD
          gh release create "$tag" "$asset" \
            --title "Rime iOS · 拆分/拼音运行资源修复" \
            --notes "修复仓输入法与元书输入法从键盘目录同步到应用目录时遗漏 Rime 运行资源的问题。包含 OpenCC 拆分、拼音提示与表情候选词表。"
